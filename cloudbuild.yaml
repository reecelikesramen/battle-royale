# Google Cloud Build configuration for Godot exports
# Triggered by GitHub Actions after Rust builds complete
#
# Required substitutions (passed from GitHub Actions):
#   _TAG_NAME      - Version tag (e.g., v1.0.0)
#   _BUCKET        - GCS bucket name
#   _EXPORT_NAME   - Export filename base (e.g., battle-royale)
#   _PROJECT_NAME  - Godot project name (e.g., "Battle Royale")
#   _PROJECT_PATH  - Path to Godot project (e.g., godot)
#   _GODOT_VERSION - Godot version (e.g., 4.5)

steps:
  # ============ RESTORE .godot CACHE ============
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'restore-cache'
    entrypoint: bash
    args:
      - -c
      - |
        mkdir -p ${_PROJECT_PATH}/.godot
        gsutil -m cp -r gs://${_BUCKET}/cache/.godot/* ${_PROJECT_PATH}/.godot/ 2>/dev/null \
          && echo "Cache restored" \
          || echo "No cache found, will create fresh"

  # ============ DOWNLOAD RUST LIBRARIES ============
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'download-rust'
    entrypoint: bash
    args:
      - -c
      - |
        # The Sprint-3 netcode addon's gdextension manifest expects libs at
        # addons/netcode/bin/ with platform-suffixed names:
        #   linux:   libnetcode.linux.x86_64.so
        #   windows: libnetcode.windows.x86_64.dll
        #   macos:   libnetcode.macos.universal.dylib
        # CI uploads the raw cargo output names (librust.{so,dylib}, rust.dll)
        # under gs://.../rust-libs/<tag>/; rename them into place here.
        mkdir -p ${_PROJECT_PATH}/addons/netcode/bin
        mkdir -p rust/target/release
        mkdir -p rust/target/debug

        STAGE=$$(mktemp -d)
        gsutil -m cp gs://${_BUCKET}/rust-libs/${_TAG_NAME}/* "$$STAGE/"

        cp "$$STAGE/librust.so"     ${_PROJECT_PATH}/addons/netcode/bin/libnetcode.linux.x86_64.so
        cp "$$STAGE/rust.dll"       ${_PROJECT_PATH}/addons/netcode/bin/libnetcode.windows.x86_64.dll
        cp "$$STAGE/librust.dylib"  ${_PROJECT_PATH}/addons/netcode/bin/libnetcode.macos.universal.dylib

        # The gdextension manifest's debug-mode entries point at the in-tree
        # rust/target/debug/ paths used during local dev. Headless export uses
        # release; populate debug paths too so godot --editor --quit-after
        # (import step) doesn't error.
        cp "$$STAGE/librust.so" rust/target/release/librust.so
        cp "$$STAGE/librust.so" rust/target/debug/librust.so
        rm -rf "$$STAGE"

        ls -la ${_PROJECT_PATH}/addons/netcode/bin/

  # ============ DOWNLOAD LAUNCHER BINARIES ============
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'download-launchers'
    entrypoint: bash
    args:
      - -c
      - |
        mkdir -p launchers/windows launchers/linux launchers/mac
        gsutil cp gs://${_BUCKET}/launcher/${_TAG_NAME}/windows/launcher.exe         launchers/windows/launcher.exe
        gsutil cp gs://${_BUCKET}/launcher/${_TAG_NAME}/windows/launcher-updater.exe launchers/windows/launcher-updater.exe
        gsutil cp gs://${_BUCKET}/launcher/${_TAG_NAME}/linux/launcher               launchers/linux/launcher
        gsutil cp gs://${_BUCKET}/launcher/${_TAG_NAME}/linux/launcher-updater       launchers/linux/launcher-updater
        gsutil cp gs://${_BUCKET}/launcher/${_TAG_NAME}/mac/launcher                 launchers/mac/launcher
        gsutil cp gs://${_BUCKET}/launcher/${_TAG_NAME}/mac/launcher-updater         launchers/mac/launcher-updater
        chmod +x launchers/linux/launcher launchers/mac/launcher launchers/linux/launcher-updater launchers/mac/launcher-updater
        ls -la launchers/*

  # ============ DOWNLOAD PREVIOUS BASE PCKs (for patches) ============
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'download-previous-pcks'
    entrypoint: bash
    args:
      - -c
      - |
        mkdir -p previous-pcks
        # Find previous release (list releases, get second newest if exists)
        RELEASES=$$(gsutil ls gs://${_BUCKET}/releases/ 2>/dev/null | grep -v "^gs://${_BUCKET}/releases/$$" | sort -V)
        PREV_RELEASE=$$(echo "$$RELEASES" | grep -v "${_TAG_NAME}" | tail -1)
        
        if [ -n "$$PREV_RELEASE" ]; then
          echo "Previous release: $$PREV_RELEASE"
          gsutil -m cp $${PREV_RELEASE}*-base.pck previous-pcks/ 2>/dev/null \
            && echo "Previous PCKs downloaded" \
            || echo "No previous base PCKs found"
        else
          echo "No previous release found, skipping patch generation"
        fi
        ls -la previous-pcks/ || true

  # ============ SET VERSION IN project.godot AND CREATE VERSION FILE ============
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'set-version'
    entrypoint: bash
    args:
      - -c
      - |
        # Replace VERSION.txt file with full semver tag (overwrites existing)
        echo "${_TAG_NAME}" > ${_PROJECT_PATH}/VERSION.txt
        echo "Set VERSION.txt to: $$(cat ${_PROJECT_PATH}/VERSION.txt)"
        
        # Extract numeric version (strip 'v' prefix and prerelease/build metadata)
        # e.g., v0.2.5-alpha.1 => 0.2.5
        NUMERIC_VERSION=$$(echo "${_TAG_NAME}" | sed 's/^v//' | sed 's/-.*//')
        sed -i 's/config\/version="[^"]*"/config\/version="'$$NUMERIC_VERSION'"/' ${_PROJECT_PATH}/project.godot
        echo "Set numeric version to $$NUMERIC_VERSION in project.godot"
        grep 'config/version' ${_PROJECT_PATH}/project.godot

  # ============ RUN GODOT EDITOR (import assets) ============
  - name: 'barichello/godot-ci:${_GODOT_VERSION}'
    id: 'godot-import'
    entrypoint: bash
    env: ['HOME=/root']
    args:
      - -c
      - |
        cd ${_PROJECT_PATH}
        godot --headless --editor --quit-after 30 || true
        echo "Asset import complete"

  # ============ EXPORT WINDOWS ============
  - name: 'barichello/godot-ci:${_GODOT_VERSION}'
    id: 'export-windows'
    entrypoint: bash
    env: ['HOME=/root']
    args:
      - -c
      - |
        mkdir -p build/windows
        cd ${_PROJECT_PATH}
        godot --headless --export-release "Windows" ../build/windows/${_EXPORT_NAME}.exe || true
        
        # Copy base PCK
        if [ -f "../build/windows/${_EXPORT_NAME}.pck" ]; then
          cp "../build/windows/${_EXPORT_NAME}.pck" "../build/windows/windows-base.pck"
        fi
        
        # Generate patch if previous exists
        if [ -f "../previous-pcks/windows-base.pck" ]; then
          godot --headless --export-patch "Windows" "../build/windows/${_TAG_NAME}.pck" \
            --patches "$$(readlink -f ../previous-pcks/windows-base.pck)" || true
        fi
        
        ls -la ../build/windows/

  # ============ EXPORT LINUX ============
  - name: 'barichello/godot-ci:${_GODOT_VERSION}'
    id: 'export-linux'
    entrypoint: bash
    env: ['HOME=/root']
    args:
      - -c
      - |
        mkdir -p build/linux
        cd ${_PROJECT_PATH}
        godot --headless --export-release "Linux" ../build/linux/${_EXPORT_NAME}.x86_64 || true
        
        # Copy base PCK
        if [ -f "../build/linux/${_EXPORT_NAME}.pck" ]; then
          cp "../build/linux/${_EXPORT_NAME}.pck" "../build/linux/linux-base.pck"
        fi
        
        # Generate patch if previous exists
        if [ -f "../previous-pcks/linux-base.pck" ]; then
          godot --headless --export-patch "Linux" "../build/linux/${_TAG_NAME}.pck" \
            --patches "$$(readlink -f ../previous-pcks/linux-base.pck)" || true
        fi
        
        ls -la ../build/linux/

  # ============ EXPORT MACOS ============
  - name: 'barichello/godot-ci:${_GODOT_VERSION}'
    id: 'export-mac'
    entrypoint: bash
    env: ['HOME=/root']
    args:
      - -c
      - |
        mkdir -p build/mac
        cd ${_PROJECT_PATH}
        godot --headless --export-release "macOS" ../build/mac/${_EXPORT_NAME}.zip || true
        cd ..
        
        # Only proceed if export succeeded
        if [ ! -f "build/mac/${_EXPORT_NAME}.zip" ]; then
          echo "macOS export failed - no zip file created"
          ls -la build/mac/ || true
          exit 0
        fi
        
        # Extract to get PCK
        cd build/mac
        unzip -q -o ${_EXPORT_NAME}.zip || true
        
        # Copy base PCK (from app bundle)
        if [ -f "${_PROJECT_NAME}.app/Contents/Resources/${_PROJECT_NAME}.pck" ]; then
          cp "${_PROJECT_NAME}.app/Contents/Resources/${_PROJECT_NAME}.pck" "mac-base.pck"
        fi
        
        # Clean up extracted app (save space)
        rm -rf "${_PROJECT_NAME}.app" || true
        cd ../..
        
        # Generate patch if previous exists
        if [ -f "previous-pcks/mac-base.pck" ]; then
          cd ${_PROJECT_PATH}
          godot --headless --export-patch "macOS" "../build/mac/${_TAG_NAME}.pck" \
            --patches "$$(readlink -f ../previous-pcks/mac-base.pck)" || true
          cd ..
        fi
        
        ls -la build/mac/

  # ============ OS CODESIGNING (must run before zip so signed exes ship in release zips) ============
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'codesign-windows-prezip'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if gcloud secrets describe authenticode-cert --quiet >/dev/null 2>&1; then
          which osslsigncode >/dev/null 2>&1 || (DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Lock::Timeout=60 update -qq && DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Lock::Timeout=60 install -y -qq osslsigncode)
          CERT=$$(mktemp)
          PASS=$$(gcloud secrets versions access latest --secret=authenticode-password)
          gcloud secrets versions access latest --secret=authenticode-cert > "$$CERT"
          # Sign both the game .exe and the launcher .exe before they get zipped.
          for f in build/windows/${_EXPORT_NAME}.exe launchers/windows/launcher.exe; do
            [ -f "$$f" ] || continue
            osslsigncode sign -pkcs12 "$$CERT" -pass "$$PASS" -in "$$f" -out "$$f.signed" \
              -h sha256 -t http://timestamp.digicert.com
            mv "$$f.signed" "$$f"
          done
          shred -u "$$CERT"
        else
          echo "no authenticode-cert secret; skipping Windows codesigning"
        fi

  # ============ ZIP BUILDS ============
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'zip-builds'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        mkdir -p release

        # Bundle the launcher binary alongside each platform's game files.
        # The launcher is the new primary entrypoint (game can still be
        # launched directly for legacy clients via BR_LEGACY_UPDATER=1).
        cp launchers/windows/launcher.exe         build/windows/launcher.exe         2>/dev/null || true
        cp launchers/windows/launcher-updater.exe build/windows/launcher-updater.exe 2>/dev/null || true
        cp launchers/linux/launcher               build/linux/launcher               2>/dev/null || true
        cp launchers/linux/launcher-updater       build/linux/launcher-updater       2>/dev/null || true
        chmod +x build/linux/launcher build/linux/launcher-updater 2>/dev/null || true
        cp infrastructure/cloudbuild-steps/linux-launcher.desktop build/linux/Battle\ Royale.desktop 2>/dev/null || true

        # Windows
        (cd build && zip -r ../release/windows.zip windows)
        mv build/windows/windows-base.pck release/ 2>/dev/null || true
        mv build/windows/${_TAG_NAME}.pck release/windows-${_TAG_NAME}.pck 2>/dev/null || true

        # Linux
        (cd build && zip -r ../release/linux.zip linux)
        mv build/linux/linux-base.pck release/ 2>/dev/null || true
        mv build/linux/${_TAG_NAME}.pck release/linux-${_TAG_NAME}.pck 2>/dev/null || true

        # Mac: rewrap Godot's exported .app so the launcher is the entry point.
        # Double-click of Battle Royale.app then opens the launcher UI directly
        # instead of running the raw game in a Terminal session. Gatekeeper
        # approval covers the whole bundle in one right-click → Open.
        _EXPORT_NAME=${_EXPORT_NAME} bash infrastructure/cloudbuild-steps/build-mac-app.sh
        mv build/mac/${_EXPORT_NAME}.zip release/mac.zip 2>/dev/null || true
        mv build/mac/mac-base.pck release/ 2>/dev/null || true
        mv build/mac/${_TAG_NAME}.pck release/mac-${_TAG_NAME}.pck 2>/dev/null || true

        ls -la release/

  # macOS codesigning + notarization runs on a macOS host, not Cloud Build's
  # Linux runners. The Linux pipeline can only validate that the cert secret
  # exists; the actual sign/notarize is a manual or self-hosted-runner step.
  # See infrastructure/README.md "Codesigning" section.

  # ============ UPLOAD RELEASE ARTIFACTS ============
  # Parallel composite uploads chunk files >150MB into pieces uploaded in
  # parallel, then GCS server-side composes them. Cuts upload time roughly
  # in half for the platform zips. Safe here because our downloaders (the
  # launcher's reqwest, refresh.sh's curl) use plain HTTP — the crcmod
  # warning only affects `gsutil cp` downloads, which we don't use.
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'upload-release'
    args:
      - '-m'
      - '-o'
      - 'GSUtil:parallel_composite_upload_threshold=150M'
      - 'cp'
      - '-r'
      - 'release/*'
      - 'gs://${_BUCKET}/releases/${_TAG_NAME}/'

  # ============ GENERATE ZSTD DELTAS ============
  # zstd --patch-from for game binary, rust lib, launcher per platform.
  # Uploads to gs://${_BUCKET}/deltas/${_TAG_NAME}/{platform}/{component}.zpatch.
  # generate-manifest-v2 (next step) picks these up automatically.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'generate-deltas'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        which zstd >/dev/null 2>&1 || (DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Lock::Timeout=60 update -qq && DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Lock::Timeout=60 install -y -qq zstd unzip)
        chmod +x infrastructure/cloudbuild-steps/generate-deltas.sh
        env _BUCKET='${_BUCKET}' _TAG_NAME='${_TAG_NAME}' _EXPORT_NAME='${_EXPORT_NAME}' \
            _PROJECT_NAME='${_PROJECT_NAME}' _PROJECT_PATH='${_PROJECT_PATH}' \
          infrastructure/cloudbuild-steps/generate-deltas.sh

  # ============ GENERATE versions.json + ed25519 signature ============
  # Produces a per-platform, per-component manifest with sha256s, signed by
  # the ed25519 key in Secret Manager. The launcher downloads versions.json
  # + .sig, verifies, and uses checksum-driven updates.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'generate-manifest'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Install jq via direct binary download to avoid apt/dpkg hangs in the
        # builder. Pin to a known-good release.
        if ! command -v jq >/dev/null 2>&1; then
          curl -fsSL -o /usr/local/bin/jq \
            https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
          chmod +x /usr/local/bin/jq
        fi
        chmod +x infrastructure/cloudbuild-steps/generate-manifest-v2.sh
        env _BUCKET='${_BUCKET}' _TAG_NAME='${_TAG_NAME}' _EXPORT_NAME='${_EXPORT_NAME}' \
          infrastructure/cloudbuild-steps/generate-manifest-v2.sh
        gsutil cp versions.json gs://${_BUCKET}/versions.json

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'sign-manifest'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        which openssl >/dev/null 2>&1 || (DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Lock::Timeout=60 update -qq && DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Lock::Timeout=60 install -y -qq openssl)
        gsutil cp gs://${_BUCKET}/versions.json versions.json
        chmod +x infrastructure/cloudbuild-steps/sign-manifest.sh
        env GCP_PROJECT_ID="$PROJECT_ID" \
          infrastructure/cloudbuild-steps/sign-manifest.sh
        gsutil cp versions.json.sig gs://${_BUCKET}/versions.json.sig

  # ============ VERIFY PUBLISHED MANIFEST ============
  # Smoke-tests the freshly-published manifest from the same public URL a real
  # launcher hits. Verifies the ed25519 signature with the committed pubkey,
  # HEADs every component URL, and sha256-checks one component per platform.
  # If anything fails, the release is "published but rejected" — the Pub/Sub
  # broadcast below is skipped and the server won't auto-restart onto a broken
  # release. Operator must roll forward with a fixed manifest.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'verify-manifest'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        which openssl >/dev/null 2>&1 || (DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Lock::Timeout=60 update -qq && DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Lock::Timeout=60 install -y -qq openssl)
        if ! command -v jq >/dev/null 2>&1; then
          curl -fsSL -o /usr/local/bin/jq \
            https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
          chmod +x /usr/local/bin/jq
        fi
        chmod +x infrastructure/cloudbuild-steps/verify-manifest.sh
        env _BUCKET='${_BUCKET}' _TAG_NAME='${_TAG_NAME}' \
          infrastructure/cloudbuild-steps/verify-manifest.sh

  # ============ PUBLISH RELEASE TO PUB/SUB ============
  # Tells the running game server (and any other subscribers) that a new
  # release is available. The VM's server-agent receives this and triggers
  # a graceful restart that picks up the new build.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'publish-release'
    args:
      - 'pubsub'
      - 'topics'
      - 'publish'
      - 'game-builds'
      - '--message=${_TAG_NAME}'

  # ============ SAVE .godot CACHE ============
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'save-cache'
    args:
      - '-m'
      - 'rsync'
      - '-r'
      - '-d'
      - '${_PROJECT_PATH}/.godot'
      - 'gs://${_BUCKET}/cache/.godot'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'  # 30 minutes max

