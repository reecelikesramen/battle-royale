[package]
name = "launcher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "launcher"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["slint"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
directories = "5.0"
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
slint = { version = "1.8", optional = true, default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }

[build-dependencies]
slint-build = "1.8"
