[workspace]
resolver = "3"
members = [
    "rust",
    "launcher",
    "launcher-updater",
    "server-agent",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = "2.1"
anyhow = "1.0"
thiserror = "2.0"

# Release builds: no debug info, strip symbols. Cuts Windows target/ roughly
# in half (MSVC otherwise emits big .pdb files even for release), and shrinks
# all platforms a little. CI also passes RUSTFLAGS=-Cdebuginfo=0 to remove
# upstream-crate debug info from rmeta/rlib intermediates.
[profile.release]
debug = false
strip = "symbols"
