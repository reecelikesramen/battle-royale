[workspace]
resolver = "3"
members = [
    "rust",
    "launcher",
    "server-agent",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = "2.1"
anyhow = "1.0"
thiserror = "2.0"
